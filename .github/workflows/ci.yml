name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # O build roda o typecheck antes do vite build.
      - run: npm run build
